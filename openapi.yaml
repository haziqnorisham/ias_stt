openapi: 3.0.3
info:
  title: ias_stt — Trap Management API
  version: 1.0.0
  description: |
    Trap management service with deployment tracking, location
    history, and photo upload. Telemetry is ingested from the
    ChirpStack HTTP integration via `POST /api/telemetry/ingest`
    (an optional MQTT listener remains available). Application users obtain
    JWT access and refresh tokens from `/auth/login` and send access tokens in
    the `Authorization` header. A legacy API key remains available for service
    integrations.

servers:
  - url: http://localhost:8080
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Health
    description: Public service health checks
  - name: Auth
    description: Local-user JWT authentication
  - name: Users
    description: Administrator-only local-user management
  - name: Telemetry
    description: Decoded GPS tracker payload ingest (ChirpStack HTTP integration)
  - name: Uplinks
    description: Historical uplinks received from registered tracker devices
  - name: Trackers
    description: Registered smart trap trackers
  - name: Traps
    description: Trap device CRUD
  - name: Deployments
    description: Deployment tracking and location history
  - name: Notifications
    description: Per-user in-app notification events and state

# ===========================================================================
# Paths
# ===========================================================================
paths:
  # -- Public ----------------------------------------------------------------
  /:
    get:
      tags: [Health]
      summary: Hello World
      operationId: helloWorld
      security: []
      responses:
        200:
          description: Plain-text greeting
          content:
            text/plain:
              example: Hello World

  /api/health:
    get:
      tags: [Health]
      summary: Service health check
      operationId: health
      security: []
      responses:
        200:
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok

  # -- Auth ------------------------------------------------------------------
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate a local user
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        200:
          description: Access and refresh tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current authenticated user
      operationId: currentUser
      responses:
        200:
          description: Current user and permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        401:
          $ref: '#/components/responses/401'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for an access token
      operationId: refreshToken
      responses:
        200:
          description: New access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer, example: 900 }
        401:
          $ref: '#/components/responses/401'

  /auth/logout:
    post:
      tags: [Auth]
      summary: End the client JWT session
      operationId: logout
      security: []
      responses:
        204:
          description: Tokens may be discarded by the client

  /api/users:
    get:
      tags: [Users]
      summary: List local users
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: search
          in: query
          schema: { type: string }
          description: Search username, display name, or email
      responses:
        200:
          description: Users array
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        422:
          $ref: '#/components/responses/422'

    post:
      tags: [Users]
      summary: Create a local user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        201:
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        409:
          $ref: '#/components/responses/409'
        422:
          $ref: '#/components/responses/422'

  /api/users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Users]
      summary: Get a local user
      operationId: getUser
      responses:
        200:
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'

    put:
      tags: [Users]
      summary: Update a local user
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        200:
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        422:
          $ref: '#/components/responses/422'

    delete:
      tags: [Users]
      summary: Delete a local user
      operationId: deleteUser
      responses:
        200:
          description: User deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'

  /api/auth/verify:
    get:
      tags: [Auth]
      summary: Verify API key
      operationId: verifyApiKey
      responses:
        200:
          description: Key is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
        401:
          $ref: '#/components/responses/401'

  # -- Telemetry -------------------------------------------------------------
  /api/telemetry/ingest:
    post:
      tags: [Telemetry]
      summary: Ingest a decoded GPS tracker payload
      description: |
        Receives the ChirpStack JSON uplink envelope pushed by the
        ChirpStack HTTP integration. Processing is identical to the
        (optional) MQTT path: `deviceInfo.devEui` is looked up in the
        trackers table; unknown devices are silently ignored (still
        `200`). `object.latitude`, `object.longitude`,
        `object.position`, and `object.battery` update the tracker,
        and the geofence/deployment logic runs when coordinates are
        present.
      operationId: telemetryIngest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryPayload'
            example:
              deviceInfo:
                devEui: a1b2c3d4e5f6a7b8
                deviceName: trap-tracker-01
              object:
                latitude: -1.2921
                longitude: 36.8219
                position: normal
                battery: 95
      responses:
        200:
          description: Payload accepted and processed (unknown devEui included)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [processed] }
              example:
                status: processed
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'

  # -- Uplink history ---------------------------------------------------------
  /api/uplinks:
    get:
      tags: [Uplinks]
      summary: List stored tracker uplinks
      description: |
        Returns persisted uplinks from registered tracker devices, newest
        first. The raw payload is excluded from list results; use the detail
        endpoint to retrieve it.
      operationId: listUplinks
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: device_eui
          in: query
          schema: { type: string, maxLength: 100 }
          description: Filter by tracker device EUI
        - name: source
          in: query
          schema: { type: string, enum: [http, mqtt] }
          description: Filter by ingestion source
      responses:
        200:
          description: Stored uplinks, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrackerUplink'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'

  /api/uplinks/{uplink_id}:
    parameters:
      - name: uplink_id
        in: path
        required: true
        schema: { type: integer }
        description: Uplink primary key ID
    get:
      tags: [Uplinks]
      summary: Get one stored tracker uplink
      description: Includes the original decoded JSON payload.
      operationId: getUplink
      responses:
        200:
          description: Stored uplink details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackerUplinkDetail'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'

  # -- Notifications ----------------------------------------------------------
  /api/notifications:
    get:
      tags: [Notifications]
      summary: List notifications for the current user
      description: |
        Returns non-expired notifications joined with the current user's
        read and dismissal state. The default `active` status excludes
        notifications dismissed by the current user.
      operationId: listNotifications
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, unread, read, dismissed, all]
            default: active
          description: Filter by the current user's notification state
        - $ref: '#/components/parameters/notification_limit'
        - $ref: '#/components/parameters/offset'
        - name: event_type
          in: query
          schema: { type: string, maxLength: 100 }
          description: Filter by event type
        - name: severity
          in: query
          schema: { type: string, maxLength: 20 }
          description: Filter by severity
        - name: entity_type
          in: query
          schema: { type: string, maxLength: 50 }
          description: Filter by related entity type
      responses:
        200:
          description: Notifications and current-user state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        422:
          $ref: '#/components/responses/422'

  /api/notifications/test:
    post:
      tags: [Notifications]
      summary: Create an administrator test notification
      description: |
        Creates a normal in-app notification event for frontend and delivery
        testing. This endpoint requires the administrator `settings:admin`
        permission. The notification is visible to users through the normal
        notification list endpoint and is not sent through external channels.
      operationId: createTestNotification
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestNotificationRequest'
            example:
              title: Test notification
              message: This is a test notification.
              severity: info
      responses:
        201:
          description: Test notification created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        422:
          $ref: '#/components/responses/422'
        500:
          $ref: '#/components/responses/500'

  /api/notifications/summary:
    get:
      tags: [Notifications]
      summary: Get notification counts for the current user
      operationId: notificationSummary
      responses:
        200:
          description: Active and unread notification counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSummary'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'

  /api/notifications/{notification_id}:
    parameters:
      - name: notification_id
        in: path
        required: true
        schema: { type: integer }
        description: Notification primary key ID
    get:
      tags: [Notifications]
      summary: Get one notification for the current user
      operationId: getNotification
      responses:
        200:
          description: Notification and current-user state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'

  /api/notifications/{notification_id}/read:
    parameters:
      - name: notification_id
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Notifications]
      summary: Mark a notification as read for the current user
      operationId: markNotificationRead
      responses:
        200:
          description: Updated notification state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'

  /api/notifications/{notification_id}/dismiss:
    parameters:
      - name: notification_id
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Notifications]
      summary: Dismiss a notification for the current user
      operationId: dismissNotification
      responses:
        200:
          description: Updated notification state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'

  # -- Trackers ---------------------------------------------------------------
  /api/stt/unassigned:
    get:
      tags: [Trackers]
      summary: List trackers that are not assigned to a trap
      description: |
        Returns registered trackers whose `device_eui` does not match a
        non-empty `tracker_id` on any trap. Both active and inactive traps
        count as assignments. Matching is exact and case-sensitive.
      operationId: listUnassignedTrackers
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        200:
          description: A JSON array of unassigned trackers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SmartTrapTracker'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'

  # -- Traps -----------------------------------------------------------------
  /api/traps:
    get:
      tags: [Traps]
      summary: List traps
      operationId: listTraps
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive] }
          description: Filter by trap status
      responses:
        200:
          description: A JSON array of traps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trap'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'

    post:
      tags: [Traps]
      summary: Create a trap
      operationId: createTrap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrapCreate'
            example:
              status: active
              trap_id: TRAP-001
              tracker_id: TRK-001
              location: north
              temperature: 23.5
              updated_by: alice
      responses:
        201:
          description: Trap created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trap'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        409:
          $ref: '#/components/responses/409'

  /api/traps/{trap_id}:
    parameters:
      - name: trap_id
        in: path
        required: true
        schema: { type: integer }
        description: Trap primary key ID

    get:
      tags: [Traps]
      summary: Get a trap by ID
      operationId: getTrap
      responses:
        200:
          description: Trap found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trap'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'

    put:
      tags: [Traps]
      summary: Update a trap
      description: |
        Requires `updated_by`. Status changes trigger automatic
        deployment create/close; location changes record location
        history under the active deployment.
      operationId: updateTrap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrapUpdate'
            example:
              status: inactive
              location: east
              updated_by: alice
      responses:
        200:
          description: Trap updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trap'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'

    delete:
      tags: [Traps]
      summary: Delete a trap
      operationId: deleteTrap
      responses:
        200:
          description: Trap deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
              example:
                message: Trap 1 deleted
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'

  # -- Deployments -----------------------------------------------------------
  /api/deployments:
    get:
      tags: [Deployments]
      summary: List deployments
      operationId: listDeployments
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: trap_id
          in: query
          schema: { type: integer }
          description: Filter by trap ID
        - name: status
          in: query
          schema: { type: string, enum: [active, closed] }
          description: Filter by deployment status
      responses:
        200:
          description: A JSON array of deployments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deployment'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'

    post:
      tags: [Deployments]
      summary: Manually create a deployment
      operationId: createDeployment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentCreate'
            example:
              trap_id: 1
              location: north
              notes: Initial placement
      responses:
        201:
          description: Deployment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'

  /api/deployments/{deployment_id}:
    parameters:
      - name: deployment_id
        in: path
        required: true
        schema: { type: integer }
        description: Deployment primary key ID

    get:
      tags: [Deployments]
      summary: Get a deployment by ID
      operationId: getDeployment
      responses:
        200:
          description: Deployment found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'

    put:
      tags: [Deployments]
      summary: Update deployment details
      operationId: updateDeployment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentUpdate'
            example:
              animal_capture: 2 rats
              notes: Updated notes
      responses:
        200:
          description: Deployment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'

    delete:
      tags: [Deployments]
      summary: Delete a deployment
      operationId: deleteDeployment
      responses:
        200:
          description: Deployment deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
              example:
                message: Deployment 1 deleted
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'

  /api/deployments/{deployment_id}/photo:
    parameters:
      - name: deployment_id
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Deployments]
      summary: Upload a photo for a deployment
      operationId: uploadPhoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (jpg, jpeg, png, gif)
              required: [file]
      responses:
        200:
          description: Photo uploaded; `photo_url` and `photo_filename` are set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'

  /api/deployments/{deployment_id}/photos/{photo_id}:
    parameters:
      - name: deployment_id
        in: path
        required: true
        schema: { type: integer }
      - name: photo_id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Deployments]
      summary: Retrieve an authenticated deployment photo
      operationId: getDeploymentPhoto
      responses:
        200:
          description: Image bytes
          content:
            image/jpeg: {}
            image/png: {}
            image/gif: {}
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'

  /api/deployments/{deployment_id}/locations:
    parameters:
      - name: deployment_id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Deployments]
      summary: List location history for a deployment
      operationId: deploymentLocations
      responses:
        200:
          description: Location history array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeploymentLocation'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'

  /api/deployments/{deployment_id}/locations/latest:
    parameters:
      - name: deployment_id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Deployments]
      summary: Get the most recent location for a deployment
      operationId: deploymentLatestLocation
      responses:
        200:
          description: Latest location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentLocation'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'

  # -- Trap-scoped nested ----------------------------------------------------
  /api/traps/{trap_id}/deployments:
    parameters:
      - name: trap_id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Deployments]
      summary: List all deployments for a trap
      operationId: trapDeployments
      responses:
        200:
          description: Deployments array (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deployment'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'

  /api/traps/{trap_id}/deployments/active:
    parameters:
      - name: trap_id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Deployments]
      summary: Get the active deployment for a trap
      operationId: trapActiveDeployment
      responses:
        200:
          description: Active deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'

  /api/traps/{trap_id}/locations:
    parameters:
      - name: trap_id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Deployments]
      summary: List all location history across all deployments for a trap
      operationId: trapLocations
      responses:
        200:
          description: Location history array (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeploymentLocation'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'

# ===========================================================================
# Components
# ===========================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Application users pass the JWT access token as
        `Authorization: Bearer <access-token>`. Legacy service integrations
        may pass the configured API key in the same header.

  # -- Reusable parameters ---------------------------------------------------
  parameters:
    limit:
      name: limit
      in: query
      schema: { type: integer, default: 100, minimum: 0 }
      description: Maximum items per page
    notification_limit:
      name: limit
      in: query
      schema: { type: integer, default: 25, minimum: 0, maximum: 100 }
      description: Maximum notifications per page
    offset:
      name: offset
      in: query
      schema: { type: integer, default: 0, minimum: 0 }
      description: Number of items to skip

  # -- Schemas ---------------------------------------------------------------
  schemas:
    Error:
      type: object
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              properties:
                code: { type: string }
                message: { type: string }
      example:
        error:
          code: AUTHENTICATION_REQUIRED
          message: Authentication is required.

    AuthUser:
      type: object
      properties:
        username: { type: string }
        display_name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        role: { type: string, enum: [administrator, field_operator, read_only] }
        permissions:
          type: array
          items: { type: string }

    LoginResponse:
      type: object
      properties:
        authenticated: { type: boolean }
        user: { $ref: '#/components/schemas/AuthUser' }
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 900 }
        refresh_expires_in: { type: integer, example: 604800 }
        expires_at: { type: string, format: date-time }
        refresh_expires_at: { type: string, format: date-time }

    AuthMeResponse:
      type: object
      properties:
        authenticated: { type: boolean }
        user: { $ref: '#/components/schemas/AuthUser' }
        expires_at: { type: string, format: date-time }

    User:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        username: { type: string, maxLength: 150, readOnly: true }
        display_name: { type: string, maxLength: 255, nullable: true }
        email: { type: string, maxLength: 255, nullable: true }
        role:
          type: string
          enum: [administrator, field_operator, read_only]
        is_active: { type: boolean }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    UserCreate:
      type: object
      required: [username, password, role]
      properties:
        username: { type: string, maxLength: 150 }
        password: { type: string, format: password, minLength: 8, writeOnly: true }
        display_name: { type: string, maxLength: 255, nullable: true }
        email: { type: string, maxLength: 255, nullable: true }
        role:
          type: string
          enum: [administrator, field_operator, read_only]
        is_active: { type: boolean, default: true }

    UserUpdate:
      type: object
      properties:
        password: { type: string, format: password, minLength: 8, writeOnly: true }
        display_name: { type: string, maxLength: 255, nullable: true }
        email: { type: string, maxLength: 255, nullable: true }
        role:
          type: string
          enum: [administrator, field_operator, read_only]
        is_active: { type: boolean }

    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
      example:
        status: ok

    TelemetryPayload:
      type: object
      description: ChirpStack decoded uplink envelope.
      properties:
        deviceInfo:
          type: object
          properties:
            devEui:      { type: string, description: LoRaWAN device EUI; must match a tracker row. }
            deviceName:  { type: string }
        object:
          type: object
          properties:
            latitude:    { type: number, format: float }
            longitude:   { type: number, format: float }
            position:    { type: string, description: Mapped to tracker tilt_status. }
            battery:     { type: integer }
      required: [deviceInfo]

    SmartTrapTracker:
      type: object
      properties:
        id:            { type: integer, readOnly: true }
        display_name:  { type: string, maxLength: 255, nullable: true }
        device_eui:    { type: string, maxLength: 100 }
        latitude:      { type: number, format: float, nullable: true }
        longitude:     { type: number, format: float, nullable: true }
        tilt_status:   { type: string, maxLength: 50, nullable: true }
        battery:       { type: integer, nullable: true }
        created_date:  { type: string, format: date-time, nullable: true }
        updated_date:  { type: string, format: date-time, nullable: true }
      required: [id, device_eui]

    TrackerUplink:
      type: object
      properties:
        id:           { type: integer, readOnly: true }
        device_eui:   { type: string, maxLength: 100 }
        display_name: { type: string, nullable: true }
        received_at:  { type: string, format: date-time }
        source:       { type: string, enum: [http, mqtt] }
        topic:        { type: string, nullable: true }
        latitude:     { type: number, format: float, nullable: true }
        longitude:    { type: number, format: float, nullable: true }
        tilt_status:  { type: string, nullable: true }
        battery:      { type: integer, nullable: true }
      required: [id, device_eui, received_at, source]

    TrackerUplinkDetail:
      allOf:
        - $ref: '#/components/schemas/TrackerUplink'
        - type: object
          properties:
            raw_payload: { type: string }
          required: [raw_payload]

    Notification:
      type: object
      properties:
        id:            { type: integer, readOnly: true }
        event_type:    { type: string, maxLength: 100 }
        severity:      { type: string, maxLength: 20 }
        title:         { type: string, maxLength: 255 }
        message:       { type: string }
        entity_type:   { type: string, maxLength: 50, nullable: true }
        entity_id:     { type: string, maxLength: 100, nullable: true }
        source_type:   { type: string, maxLength: 50, nullable: true }
        source_id:     { type: string, maxLength: 100, nullable: true }
        payload:
          type: object
          nullable: true
          additionalProperties: true
        dedupe_key:    { type: string, maxLength: 255, nullable: true }
        created_at:    { type: string, format: date-time, readOnly: true }
        expires_at:    { type: string, format: date-time, nullable: true }
        read_at:      { type: string, format: date-time, nullable: true }
        dismissed_at: { type: string, format: date-time, nullable: true }
      required: [id, event_type, severity, title, message, created_at]

    TestNotificationRequest:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 255 }
        message: { type: string, maxLength: 2000 }
        severity: { type: string, enum: [info, warning, critical] }

    NotificationListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        unread_count: { type: integer, minimum: 0 }
        total_count: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
      required: [items, unread_count, total_count, limit, offset]

    NotificationSummary:
      type: object
      properties:
        active_count: { type: integer, minimum: 0 }
        unread_count: { type: integer, minimum: 0 }
      required: [active_count, unread_count]

    Trap:
      type: object
      properties:
        id:                { type: integer, readOnly: true }
        status:            { type: string, enum: [active, inactive] }
        trap_id:           { type: string, maxLength: 50 }
        tracker_id:        { type: string, maxLength: 50 }
        location:          { type: string, maxLength: 50, nullable: true }
        door_status:       { type: string, maxLength: 20, nullable: true }
        temperature:       { type: number, format: float, nullable: true }
        notes:             { type: string, maxLength: 255, nullable: true }
        updated_by:        { type: string, maxLength: 50, description: Ignored; derived from the authenticated principal. }
        created_at:        { type: string, format: date-time, readOnly: true }
        updated_at:        { type: string, format: date-time, readOnly: true }
      required:
        - status
        - trap_id

    TrapCreate:
      type: object
      properties:
        status:            { type: string, enum: [active, inactive] }
        trap_id:           { type: string, maxLength: 50 }
        tracker_id:        { type: string, maxLength: 50, description: Device EUI of an existing tracker; may be omitted/empty. }
        location:          { type: string, maxLength: 50 }
        door_status:       { type: string, maxLength: 20 }
        temperature:       { type: number, format: float }
        notes:             { type: string, maxLength: 255 }
        updated_by:        { type: string, maxLength: 50, description: Ignored; derived from the authenticated principal. }
      required: [status, trap_id]

    TrapUpdate:
      type: object
      properties:
        status:            { type: string, enum: [active, inactive] }
        trap_id:           { type: string, maxLength: 50 }
        tracker_id:        { type: string, maxLength: 50 }
        location:          { type: string, maxLength: 50 }
        door_status:       { type: string, maxLength: 20 }
        temperature:       { type: number, format: float }
        notes:             { type: string, maxLength: 255 }
        updated_by:        { type: string, maxLength: 50, description: Ignored; derived from the authenticated principal. }

    Deployment:
      type: object
      properties:
        id:                { type: integer, readOnly: true }
        trap_id:           { type: integer }
        status:            { type: string, enum: [active, closed] }
        start_date:        { type: string, format: date-time }
        end_date:          { type: string, format: date-time, nullable: true }
        animal_capture:    { type: string, maxLength: 255, nullable: true }
        photo_url:         { type: string, maxLength: 500, nullable: true }
        photo_filename:    { type: string, maxLength: 255, nullable: true }
        notes:
          type: array
          items: { $ref: '#/components/schemas/DeploymentNote' }
        pictures:
          type: array
          items: { $ref: '#/components/schemas/DeploymentPicture' }
        created_at:        { type: string, format: date-time, readOnly: true }
        updated_at:        { type: string, format: date-time, readOnly: true }

    DeploymentCreate:
      type: object
      properties:
        trap_id:           { type: integer }
        location:          { type: string, maxLength: 50 }
        notes:             { type: string, maxLength: 500 }
      required: [trap_id]

    DeploymentUpdate:
      type: object
      properties:
        animal_capture:    { type: string, maxLength: 255 }
        notes:             { type: string, maxLength: 500 }

    DeploymentNote:
      type: object
      properties:
        id: { type: integer }
        deployment_id: { type: integer }
        notes: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DeploymentPicture:
      type: object
      properties:
        id: { type: integer }
        deployment_id: { type: integer }
        photo_url: { type: string }
        photo_filename: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DeploymentLocation:
      type: object
      properties:
        id:                { type: integer, readOnly: true }
        deployment_id:     { type: integer, readOnly: true }
        location:          { type: string, maxLength: 50 }
        recorded_at:       { type: string, format: date-time }
        notes:             { type: string, maxLength: 255, nullable: true }
        created_at:        { type: string, format: date-time, readOnly: true }

  # -- Reusable responses ----------------------------------------------------
  responses:
    400:
      description: Bad request — missing or invalid fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingField:
              summary: Missing required field
              value: { error: "Missing required field(s): status" }
            invalidType:
              summary: Invalid limit/offset
              value: { error: "'limit' and 'offset' must be integers" }
    401:
      description: Missing or invalid JWT or service credential
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: AUTHENTICATION_REQUIRED
              message: Authentication is required.
    403:
      description: Authenticated user lacks the required permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: You do not have permission to perform this action.
    422:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Field 'password' must be at least 8 characters
    404:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Trap not found
    409:
      description: Conflict — duplicate trap_id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: trap_id 'TRAP-001' already exists
    500:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Internal Server Error
